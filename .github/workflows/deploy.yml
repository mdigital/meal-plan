name: Test and deploy

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Fly after tests"
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "1"

  deploy:
    needs: [test, e2e]
    # Deploy on every push to main or the build branch, or when run by hand with deploy=true.
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create the app on first run
        run: |
          APP=$(grep -E '^app *=' fly.toml | sed -E 's/.*"(.*)".*/\1/')
          flyctl status --app "$APP" >/dev/null 2>&1 || flyctl apps create "$APP" --org "$FLY_ORG"
      - run: flyctl deploy --remote-only --ha=false
